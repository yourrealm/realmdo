[package]
name = "realmdo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
jiff = { version = "0.2.35", features = ["tzdb-bundle-always"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

# Size over speed: this binary idles forever on the box.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
