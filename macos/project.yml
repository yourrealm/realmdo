# The realmdo Mac app and its widget. `xcodegen` turns this into
# Realmdo.xcodeproj; the project and the plists it writes are not tracked.
name: Realmdo
options:
  bundleIdPrefix: me.malm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 2333ESQ876
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Realmdo:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - target: RealmdoWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.malm.realmdo
        PRODUCT_NAME: realmdo
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: realmdo
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: App/Realmdo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups: [$(AppIdentifierPrefix)me.malm.realmdo]
    scheme:
      testTargets: [RealmdoTests]
  RealmdoWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.malm.realmdo.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: realmdo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/RealmdoWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups: [$(AppIdentifierPrefix)me.malm.realmdo]
  RealmdoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Realmdo
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/realmdo.app/Contents/MacOS/realmdo
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
