name: CI

# Three independent parts. `container` needs only this repo: the web UI, the
# Rust server, and the image. `realm` needs the Realm SDK, which is private to
# the holden monorepo and consumed through `link:../holden/packages/sdk`, so it
# checks holden out as a sibling directory first. `android` builds the thin
# client under android/ against the JSON API and needs nothing else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm fmt:check
          pnpm build

      - name: Server
        working-directory: server
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  realm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: realmdo
      - uses: actions/checkout@v7
        with:
          repository: benjick/holden
          path: holden
          token: ${{ secrets.HOLDEN_TOKEN || github.token }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The SDK resolves its own dependencies from holden's node_modules
      # through the symlink, so holden must be installed first.
      - name: Install Realm SDK
        working-directory: holden
        run: pnpm install --frozen-lockfile

      - name: Check realm.tsx
        working-directory: realmdo
        run: |
          corepack prepare pnpm@10.13.1 --activate
          pnpm install --frozen-lockfile
          deno fmt --check
          deno check
          pnpm exec realm-sdk test
          pnpm exec realm-sdk build --out dist/realmdo.realmpack

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

  publish:
    needs: container
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: benjick/realmdo
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
